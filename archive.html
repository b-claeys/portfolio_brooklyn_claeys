<style>
:root{--bg:#010305;--bg-deep:#000102;--text:#edf0f2;--muted:#747d83;--blue:#304955;--blue-hover:#5f7d8d;--line:rgba(46,62,72,.16);--line-soft:rgba(46,62,72,.09);--orange:#FF7A32;--orange-line:rgba(255,122,50,.65);--orange-soft:rgba(255,122,50,.12);--max:1120px;--outer:clamp(24px,4.5vw,72px);--sans:'Inter',Helvetica,Arial,sans-serif;--display:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--text);font-family:var(--sans);background:radial-gradient(900px 620px at 90% 0%,rgba(13,25,33,.038),transparent 76%),radial-gradient(760px 540px at 4% 58%,rgba(7,15,21,.017),transparent 82%),linear-gradient(180deg,var(--bg) 0%,#020507 52%,var(--bg-deep) 100%)}a{color:inherit;text-decoration:none}.page{width:min(100%,var(--max));margin:auto;padding:0 var(--outer) 54px}.nav{display:flex;justify-content:flex-end;gap:clamp(20px,2.5vw,38px);padding:34px 0 0;color:#7f8b92;font-size:10px;letter-spacing:.1em;text-transform:uppercase}.nav a{position:relative;padding:4px 0 8px}.nav a::after{content:'';position:absolute;left:0;right:0;bottom:1px;height:1px;background:var(--orange);transform:scaleX(0);transform-origin:left;transition:transform 180ms ease}.nav a:hover::after,.nav a:focus-visible::after{transform:scaleX(1)}.nav a:hover,.nav a:focus-visible{color:var(--text);outline:none}
.hero{padding:82px 0 34px;border-bottom:1px solid var(--line-soft)}.hero h1{margin:0;color:#d9dfe3;font-family:var(--display);font-size:clamp(54px,8vw,92px);line-height:.84;font-weight:600;letter-spacing:.01em;text-transform:uppercase}
.archive-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,4vw,54px);padding:40px 0 56px;align-items:start}.archive-card{display:grid;gap:14px;width:100%}.archive-media{display:block;width:100%;aspect-ratio:4/3;overflow:hidden;background:#071018;border:1px solid rgba(93,126,148,.13);transition:border-color 180ms ease,box-shadow 260ms ease}.archive-media img{display:block;width:100%;height:100%;object-fit:cover;filter:brightness(.86) saturate(.92) contrast(.99);transition:filter 240ms ease,transform 700ms cubic-bezier(.22,1,.36,1)}.archive-title{margin:0;color:var(--blue);font-size:15px;line-height:1.2;font-weight:500;letter-spacing:.04em;text-transform:uppercase;transition:color 180ms ease}.archive-card:hover .archive-media,.archive-card:focus-within .archive-media{border-color:var(--orange-line);box-shadow:0 0 0 1px var(--orange-soft),0 14px 26px rgba(0,0,0,.18)}.archive-card:hover .archive-media img,.archive-card:focus-within .archive-media img{filter:brightness(.95) saturate(.98);transform:scale(1.018)}.archive-card:hover .archive-title,.archive-card:focus-within .archive-title{color:var(--blue-hover)}
.versions{padding:28px 0 22px;border-top:1px solid var(--line-soft)}.versions-heading{margin:0 0 17px;color:#667b86;font-size:10px;line-height:1;font-weight:500;letter-spacing:.12em;text-transform:uppercase}.version-grid{display:grid;grid-template-columns:repeat(3,82px);gap:12px}.version-blank{width:82px;height:82px;border:1px solid rgba(70,94,107,.11);background:linear-gradient(145deg,rgba(18,35,44,.20),rgba(11,23,30,.12))}
.footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--line-soft);display:flex;color:var(--muted);font-size:9px;letter-spacing:.09em;text-transform:uppercase}.footer a:hover,.footer a:focus-visible{color:var(--orange);outline:none}
.archive-motion .archive-card,.archive-motion .version-blank{translate:var(--archive-enter-x,0) 0;transition:translate 820ms cubic-bezier(.22,1,.36,1)}.archive-motion .archive-card:nth-child(odd),.archive-motion .version-blank:nth-child(odd){--archive-enter-x:-26px}.archive-motion .archive-card:nth-child(even),.archive-motion .version-blank:nth-child(even){--archive-enter-x:26px}.archive-motion .archive-in-view{translate:0 0}
@media(max-width:980px){.archive-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.version-grid{grid-template-columns:repeat(3,76px)}.version-blank{width:76px;height:76px}}
@media(max-width:620px){.page{padding-inline:22px}.nav{justify-content:flex-start;font-size:9px}.hero{padding:58px 0 30px}.archive-grid{grid-template-columns:1fr;gap:28px}.version-grid{grid-template-columns:repeat(3,68px);gap:10px}.version-blank{width:68px;height:68px}}
@media(max-width:340px){.archive-grid{grid-template-columns:1fr}.archive-card,.archive-media{width:100%}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.archive-motion .archive-card,.archive-motion .version-blank{translate:none!important;transition:none!important}}

  <article class="archive-card"><a class="archive-media" href="projects_/garden/garden.html"><img loading=lazy decoding=async src="photos-main/plant_pot_leaves.webp" alt="Portable indoor garden project"></a><h2 class="archive-title"><a href="projects_/garden/garden.html">Portable Indoor Garden</a></h2></article>
</section>

<script>(()=>{if(!('IntersectionObserver'in window)||matchMedia('(prefers-reduced-motion: reduce)').matches||innerWidth<421)return;document.documentElement.classList.add('archive-motion');const els=[...document.querySelectorAll('.archive-card,.version-blank')];const io=new IntersectionObserver((entries,o)=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('archive-in-view');o.unobserve(e.target)}}),{threshold:.14,rootMargin:'0px 0px -6% 0px'});els.forEach(el=>io.observe(el))})();</script>
</body>
